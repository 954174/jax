<!DOCTYPE html>
<html>
<head>
  <title>Flappy Bird - Moving Pipes</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: skyblue;
    }
    canvas {
      display: block;
      margin: auto;
      background: lightblue;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Bird
let bird;
let pipes;
let score;

let pipeWidth = 50;
let gap = 150;

// Reset
function resetGame() {
  bird = {
    x: 50,
    y: 250,
    width: 30,
    height: 30,
    speed: 4
  };

  pipes = [];
  score = 0;
}

resetGame();

// Controls
document.addEventListener("keydown", (e) => {
  if (e.code === "ArrowUp") bird.y -= bird.speed;
  if (e.code === "ArrowDown") bird.y += bird.speed;
});

// Create pipes (WITH vertical movement)
function createPipe() {
  let topHeight = Math.random() * (canvas.height - gap);
  pipes.push({
    x: canvas.width,
    top: topHeight,
    bottom: canvas.height - topHeight - gap,
    direction: Math.random() > 0.5 ? 1 : -1 // up or down
  });
}

// Update
function update() {
  // Keep bird in bounds
  if (bird.y < 0) bird.y = 0;
  if (bird.y + bird.height > canvas.height) {
    bird.y = canvas.height - bird.height;
  }

  for (let i = 0; i < pipes.length; i++) {
    let pipe = pipes[i];

    // Move left
    pipe.x -= 2;

    // Move up/down
    pipe.top += pipe.direction * 1;
    pipe.bottom = canvas.height - pipe.top - gap;

    // Bounce at limits
    if (pipe.top <= 0 || pipe.top >= canvas.height - gap) {
      pipe.direction *= -1;
    }

    // Collision = restart
    if (
      bird.x < pipe.x + pipeWidth &&
      bird.x + bird.width > pipe.x &&
      (bird.y < pipe.top ||
       bird.y + bird.height > canvas.height - pipe.bottom)
    ) {
      resetGame();
      return;
    }

    // Score
    if (pipe.x === bird.x) {
      score++;
    }
  }

  pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);
}

// Draw
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Bird
  ctx.fillStyle = "yellow";
  ctx.fillRect(bird.x, bird.y, bird.width, bird.height);

  // Pipes
  ctx.fillStyle = "green";
  for (let pipe of pipes) {
    ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
    ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
  }

  // Score
  ctx.fillStyle = "black";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 10, 25);
}

// Loop
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

setInterval(createPipe, 2000);
gameLoop();
</script>

</body>
</html>
