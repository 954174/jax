<!DOCTYPE html>
<html>
<head>
  <title>Flappy Bird - Restart Version</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: skyblue;
    }
    canvas {
      display: block;
      margin: auto;
      background: lightblue;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Bird
let bird;
let pipes;
let score;

let pipeWidth = 50;
let gap = 150;

// Reset function
function resetGame() {
  bird = {
    x: 50,
    y: 250,
    width: 30,
    height: 30,
    speed: 4
  };

  pipes = [];
  score = 0;
}

// Start game first time
resetGame();

// Controls
document.addEventListener("keydown", (e) => {
  if (e.code === "ArrowUp") bird.y -= bird.speed;
  if (e.code === "ArrowDown") bird.y += bird.speed;
});

// Create pipes
function createPipe() {
  let topHeight = Math.random() * (canvas.height - gap);
  pipes.push({
    x: canvas.width,
    top: topHeight,
    bottom: canvas.height - topHeight - gap
  });
}

// Update
function update() {
  // Keep bird in bounds
  if (bird.y < 0) bird.y = 0;
  if (bird.y + bird.height > canvas.height) {
    bird.y = canvas.height - bird.height;
  }

  for (let i = 0; i < pipes.length; i++) {
    pipes[i].x -= 2;

    // Collision = RESTART
    if (
      bird.x < pipes[i].x + pipeWidth &&
      bird.x + bird.width > pipes[i].x &&
      (bird.y < pipes[i].top ||
       bird.y + bird.height > canvas.height - pipes[i].bottom)
    ) {
      resetGame();
      return;
    }

    // Score
    if (pipes[i].x === bird.x) {
      score++;
    }
  }

  pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);
}

// Draw
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Bird
  ctx.fillStyle = "yellow";
  ctx.fillRect(bird.x, bird.y, bird.width, bird.height);

  // Pipes
  ctx.fillStyle = "green";
  for (let pipe of pipes) {
    ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
    ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipeWidth, pipe.bottom);
  }

  // Score
  ctx.fillStyle = "black";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 10, 25);
}

// Loop
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

setInterval(createPipe, 2000);
gameLoop();
</script>

</body>
</html>
